# Uploads site/listingspark-site/ to Hostinger over FTP whenever it changes on main.
# One-time setup (GitHub repo → Settings → Secrets and variables → Actions):
#   FTP_SERVER    e.g. ftp.yourdomain.com  (hPanel → Files → FTP Accounts)
#   FTP_USERNAME  the FTP username from the same page
#   FTP_PASSWORD  the FTP password
# Only changed files are uploaded after the first run, so the large video uploads once.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
    paths: ["site/listingspark-site/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          local-dir: ./site/listingspark-site/
          # Hostinger FTP accounts usually land one level above public_html.
          # If your FTP account opens directly inside public_html, change this to ./
          server-dir: ./public_html/
          exclude: |
            **/.DS_Store
            **/.git*
            **/.git*/**
