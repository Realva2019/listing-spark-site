# Uploads site/listingspark-site/ to Hostinger over FTP whenever it changes on main.
# One-time setup (GitHub repo → Settings → Secrets and variables → Actions):
#   FTP_SERVER    the FTP IP from hPanel → Files → FTP Accounts
#   FTP_USERNAME  the FTP username from the same page
#   FTP_PASSWORD  the FTP password
# File times are restored from git history, so only files changed since the last deploy upload.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
    paths: ["site/listingspark-site/**"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp git-restore-mtime

      - name: Restore file times from git
        run: git restore-mtime site/listingspark-site

      - name: Upload
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          SETTINGS="set ftp:ssl-force yes; set ftp:passive-mode yes; set net:timeout 30; set net:max-retries 5; set net:reconnect-interval-base 5"
          for v in FTP_SERVER FTP_USERNAME; do
            val="${!v}"; echo "$v: ${#val} chars, whitespace chars: $(printf %s "$val" | tr -cd '[:space:]' | wc -c)"
          done
          FTP_SERVER=$(printf %s "$FTP_SERVER" | tr -d '[:space:]')
          FTP_USERNAME=$(printf %s "$FTP_USERNAME" | tr -d '[:space:]')
          echo "Server certificate names:"
          openssl s_client -starttls ftp -connect "$FTP_SERVER:21" </dev/null 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName | sed 's/\./[dot]/g' || true
          OPEN="open --env-password -u \"$FTP_USERNAME\" \"$FTP_SERVER\""
          LISTING=$(lftp -c "$SETTINGS; $OPEN; pwd; cls -1")
          echo "FTP root contents:"; echo "$LISTING"
          # Main Hostinger FTP accounts open one level above public_html; others open inside it.
          if echo "$LISTING" | grep -qx 'public_html/\?'; then TARGET=public_html; else TARGET=.; fi
          echo "Uploading into: $TARGET"
          lftp -c "$SETTINGS; $OPEN; mirror --reverse --only-newer --verbose --parallel=2 --exclude-glob .DS_Store site/listingspark-site/ $TARGET/"
