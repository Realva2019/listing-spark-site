# Uploads site/listingspark-site/ to Hostinger over SSH (rsync) whenever it changes on main.
# Needs one repo secret (GitHub → Settings → Secrets and variables → Actions):
#   FTP_PASSWORD  the hosting account password (Hostinger uses the same one for SSH)
# Only files whose contents changed are uploaded. Nothing on the server is deleted.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
    paths: ["site/listingspark-site/**"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SSH_HOST: 145.79.28.35
  SSH_PORT: "65002"
  SSH_USER: u479143449
  # Pinned server identity (ED25519, SHA256:pE4kPWLYqZmrucAlPSAxGVyZeQEbuWhZ51huZCqcIQM).
  # If Hostinger ever moves the site to a new server, update this line and SSH_HOST.
  KNOWN_HOST: "[145.79.28.35]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAStlCAQv1qmXXqMepywddOX0WJPwC7SLmO13lWQpwcL"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          mkdir -p ~/.ssh && echo "$KNOWN_HOST" > ~/.ssh/known_hosts
          printf 'Host hostinger\n  HostName %s\n  Port %s\n  User %s\n  StrictHostKeyChecking yes\n  HostKeyAlgorithms ssh-ed25519\n' \
            "$SSH_HOST" "$SSH_PORT" "$SSH_USER" > ~/.ssh/config

      - name: Upload
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Pasted secrets sometimes pick up a trailing newline or space.
          export SSHPASS="$(printf %s "$SSHPASS" | sed -e 's/[[:space:]]*$//' -e 's/^[[:space:]]*//')"
          # Find the site's web root: ~/domains/<domain>/public_html (must be exactly one).
          ROOTS=$(sshpass -e ssh hostinger 'ls -d domains/*/public_html 2>/dev/null')
          echo "Web roots found:"; echo "$ROOTS"
          [ "$(echo "$ROOTS" | grep -c .)" = 1 ] || { echo "Expected exactly one domains/*/public_html"; exit 1; }
          sshpass -e rsync -rlz --checksum --itemize-changes --exclude '.DS_Store' \
            -e ssh site/listingspark-site/ "hostinger:$ROOTS/"
